name: Build Docker Image for arm64

#on:
#  push:
#    branches: [ main ]
#  pull_request:
#    branches: [ main ]

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    # id-token is required for the OIDC federation used to reach the services-account ECR
    # that hosts the helix.spark base image.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # spark.Dockerfile pulls helix.spark from the private services-account ECR
      # (CIE-8032). Needs the same SERVICES_ECR_ROLE_ARN repository variable documented
      # in build_and_test.yml.
      - name: AWS Credentials (services account, for helix.spark base image pull)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.SERVICES_ECR_ROLE_ARN }}
          role-session-name: ${{ github.run_id }}-services

      - name: Login to Amazon ECR (services)
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1 (2026-09-03)

      - name: Cache Docker layers
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2 (2026-09-03)
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image for arm64
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2 (2026-09-03)
        with:
          context: .
          file: ./spark.Dockerfile
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          # Do not push the image to any registry
          push: false
