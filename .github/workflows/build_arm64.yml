name: Build Docker Image for arm64

#on:
#  push:
#    branches: [ main ]
#  pull_request:
#    branches: [ main ]

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The helix.spark base image lives in the private services-account ECR
      # (CIE-8032), so docker must authenticate before any build. This repo is PUBLIC
      # and runs on GitHub-hosted runners, so it has no ambient AWS identity the way
      # helix.pipelines does (that relies on its self-hosted runner's IRSA role).
      # We therefore use a dedicated read-only IAM user's access key, matching the
      # pattern helix.pipelines already uses for the dev account.
      #
      # PREREQUISITE: the SERVICES_ECR_ACCESS_KEY_ID / SERVICES_ECR_SECRET_ACCESS_KEY
      # org secrets must be scoped to this repo. Fork pull requests receive no secrets,
      # so external-contributor PRs cannot build these images.
      - name: AWS Credentials (services account, for helix.spark base image pull)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.SERVICES_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SERVICES_ECR_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR (services)
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1 (2026-09-03)

      - name: Cache Docker layers
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2 (2026-09-03)
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image for arm64
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2 (2026-09-03)
        with:
          context: .
          file: ./spark.Dockerfile
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          # Do not push the image to any registry
          push: false
