name: Build and Test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # id-token is required for the OIDC federation used to reach the services-account ECR
    # that hosts the helix.spark base image.
    permissions:
      contents: read
      id-token: write

    steps:
      # Checks-out your repository
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # show docker version
      - name: show docker version
        run: docker --version

      # spark.Dockerfile and pre-commit.Dockerfile pull helix.spark from the private
      # services-account ECR (CIE-8032), so every docker build below needs an ECR login
      # first.
      #
      # HUMAN PREREQUISITE - this repo is PUBLIC and runs on `ubuntu-latest`, so it cannot
      # reuse helix.pipelines' self-hosted-runner role
      # (arn:aws:iam::856965016623:role/services-k8s-service-account-github-actions-runner).
      # Someone must provision, in the services account (856965016623):
      #   1. a GitHub OIDC provider trust for token.actions.githubusercontent.com, and
      #   2. an IAM role whose trust policy is scoped to
      #      repo:icanbwell/SparkPipelineFramework.Testing:* with ecr:GetAuthorizationToken
      #      plus read-only pull on the helix.spark repository,
      # then set the repository variable SERVICES_ECR_ROLE_ARN to that role's ARN.
      # Until that exists these two steps - and therefore the whole build - will fail.
      - name: AWS Credentials (services account, for helix.spark base image pull)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_SERVICES_ECR_ROLE_ARN }}
          role-session-name: ${{ github.run_id }}-services

      - name: Login to Amazon ECR (services)
        uses: aws-actions/amazon-ecr-login@v2

      - name: build
        run: make build

      - name: pre-commit
        run: make run-pre-commit

      # Grant the spark user (uid 185) write access to the workspace so it can
      # create metastore_db and other runtime directories on the bind-mounted volume.
      # Required because docker-compose no longer overrides USER to root.
      - name: Permission setup for non root user
        run: sudo chown -R 185:185 ${{ github.workspace }}

      # setup and install everything and run tests
      - name: up
        run: make up

      - name: tests
        run: make tests
