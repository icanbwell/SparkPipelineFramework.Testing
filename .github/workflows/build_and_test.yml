name: Build and Test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # show docker version
      - name: show docker version
        run: docker --version

      - name: build
        run: make build

      - name: pre-commit
        run: make run-pre-commit

      # Grant the spark user (uid 185) write access to the workspace so it can
      # create metastore_db and other runtime directories on the bind-mounted volume.
      # Required because docker-compose no longer overrides USER to root.
      - name: Permission setup for non root user
        run: sudo chown -R 185:185 ${{ github.workspace }}

      # setup and install everything and run tests
      - name: up
        run: make up

      - name: tests
        run: make tests
